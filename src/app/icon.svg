<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A ring seen at an angle, given volume: a lit face over a darker underside, a highlight
    on the near edge and a soft shadow beneath. Their palette and their softness, our shape.
    Squashed vertically because it is tilted back, which is what reads as depth at 16px.
  -->
  <defs>
    <linearGradient id="tube" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e8fffa"/>
      <stop offset="40%" stop-color="#97fce4"/>
      <stop offset="100%" stop-color="#37ad99"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="#0f1a1e"/>
  <ellipse cx="16" cy="17.4" rx="9.6" ry="6.1" fill="none" stroke="#0d4f47" stroke-width="5"/>
  <ellipse cx="16" cy="16.4" rx="9.6" ry="6.1" fill="none" stroke="url(#tube)" stroke-width="4.6"/>
  <path d="M6.6 15.4 a9.6 6.1 0 0 1 7.2 -5.8" fill="none" stroke="#ffffff" stroke-opacity="0.5"
        stroke-width="1.6" stroke-linecap="round"/>
</svg>
